# Supabase local development configuration.
# Run `supabase start` to boot Postgres + pgvector + Auth + Storage in Docker and
# apply everything under supabase/migrations/.
# Docs: https://supabase.com/docs/guides/local-development

project_id = "ragavvocati"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Inject tenant_id / tenant_role into issued JWTs (see custom_access_token_hook
# in migrations/0001_init.sql). This is what makes RLS tenant-aware.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.email]
enable_confirmations = false
