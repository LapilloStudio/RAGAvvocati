[project]
name = "ragavvocati-backend"
version = "0.1.0"
description = "Multi-tenant B2B RAG backend (FastAPI) for professional firms"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",       # file uploads
    "supabase>=2.9",                  # supabase-py (Auth, Storage, PostgREST, RPC)
    "anthropic>=0.40",                # Claude generation + citations
    "httpx>=0.27",                    # embeddings HTTP calls
    "pyjwt>=2.9",                     # verify Supabase access tokens (HS256)
    "pypdf>=5.1",                     # PDF parsing
    "python-docx>=1.1",               # DOCX parsing
    "openpyxl>=3.1",                  # XLSX parsing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
